# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "fd867f1151e23097f5e6035fa50804c5"
application_url = "https://aevow-ring-pilot.netlify.app"
embedded = true
name = "Aevow Ring Pilot"

[webhooks]
api_version = "2026-10"

[[webhooks.subscriptions]]
topics = ["orders/create"]
uri = "/webhooks/orders/create"

[[webhooks.subscriptions]]
topics = ["app/uninstalled"]
uri = "/webhooks/app/uninstalled"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_products,read_inventory,read_orders,write_app_proxy"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [ "https://aevow-ring-pilot.netlify.app/auth/callback" ]

[build]
automatically_update_urls_on_dev = false

[app_proxy]
url = "/proxy"
subpath = "ring-builder"
prefix = "apps"
